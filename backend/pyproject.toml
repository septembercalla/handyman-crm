[project]
name = "handyman-crm-backend"
version = "0.1.0"
description = "Handyman CRM — FastAPI backend (dispatcher console)"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "sqlalchemy>=2.0.36",
    "alembic>=1.14",
    "psycopg[binary]>=3.2",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "python-multipart>=0.0.12",
    "pyjwt>=2.10",
    "bcrypt>=4.2",
    "httpx>=0.28",
    "email-validator>=2.2",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "ruff>=0.8",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
# Generic[T] is kept over PEP 695 syntax for broader tooling support
ignore = ["UP046"]

[tool.ruff.lint.per-file-ignores]
# wide, one-row-per-line data tables read better than wrapped ones
"app/seed.py" = ["E501"]
# generated by alembic
"alembic/versions/*" = ["E501"]

[tool.pytest.ini_options]
pythonpath = ["."]
